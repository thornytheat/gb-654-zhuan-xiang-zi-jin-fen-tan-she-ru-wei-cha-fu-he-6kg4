{% extends "base.html" %}{% block content %}
<div class="grid module-7"><section class="panel panel--primary"><div class="panel__head"><h2>复核合并状态</h2><span class="panel__meta">M7 · {{ data.status|default('READY') }}</span></div><div class="panel__body panel__body--scroll"><table class="ledger"><thead><tr><th>字段</th><th>值</th><th>证据</th></tr></thead><tbody>{% for key, value in data.summary.items() %}<tr><td>{{ key }}</td><td class="num">{{ value }}</td><td>R{{ loop.index }}</td></tr>{% endfor %}</tbody></table></div></section>
<div class="stack"><section class="panel"><div class="panel__head"><h2>未决争议</h2><span class="panel__meta">{{ data.summary.open_disputes }}</span></div><div class="panel__body bars"><i style="--v:38%"></i><i style="--v:59%"></i></div></section><section class="panel"><div class="panel__head"><h2>本次动作</h2><span class="panel__meta">/api/review/merge</span></div><div class="panel__body"><button class="btn btn--primary" data-endpoint="/api/review/merge">运行 复核合并</button><pre class="result">等待运行</pre></div></section></div></div>
{% endblock %}
